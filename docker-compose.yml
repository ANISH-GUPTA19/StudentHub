services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - studenthub-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - ./.azurite:/data
    restart: unless-stopped

  db-migrate:
    image: python:3.14-slim
    working_dir: /app/services/studenthub-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app:ro
    environment:
      ENVIRONMENT: Development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      AUTH_SECRET: ${AUTH_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python -m venv /tmp/studenthub-migrate && /tmp/studenthub-migrate/bin/pip install -q -r requirements.txt && /tmp/studenthub-migrate/bin/python -m alembic upgrade head"
    restart: "no"

  api:
    build:
      context: ./services/studenthub-api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: Development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      AUTH_SECRET: ${AUTH_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  studenthub-postgres:
